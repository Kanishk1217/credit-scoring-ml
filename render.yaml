# Render deployment blueprint. Point Render at this repo; it reads this file.
services:
  - type: web
    name: credit-scoring-api
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: CREDIT_ENVIRONMENT
        value: production
      - key: CREDIT_ENABLE_DOCS
        value: "false"          # hide interactive docs in production
      - key: CREDIT_RATE_LIMIT
        value: 60/minute
      - key: CREDIT_API_KEYS
        sync: false             # SECRET — set in the Render dashboard, never in the repo
      - key: CREDIT_ALLOWED_ORIGINS
        sync: false             # set to your frontend origin(s)
