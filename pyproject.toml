[project]
name = "credit-scoring-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.140.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.1",
    "kaggle>=2.2.3",
    "lightgbm>=4.6.0",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "slowapi>=0.1.10",
    "torch>=2.13.0",
    "uvicorn[standard]>=0.51.0",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks", "*.ipynb"]   # teaching notebooks are intentionally compact

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E701", "E702"]   # E402: imports after os.environ (api/app.py); E701/E702: compact research scripts
